name: BrightFunnel
description: >-
  BrightFunnel was a San Francisco-based B2B marketing analytics company founded in 2012 that
  built a revenue attribution and forecasting platform. Its Revenue Intelligence Suite gave B2B
  marketers multi-touch attribution, revenue-funnel analysis, account-based measurement, web
  analytics, and predictive forecasting so they could quantify marketing's impact on pipeline and
  revenue and align plans with business priorities. BrightFunnel was acquired by account-based
  marketing vendor Terminus in January 2018, and its multi-channel analytics were folded into the
  Terminus platform. It no longer operates as a standalone product: the brightfunnel.com domain now
  serves only a redirect, and there is no live developer portal, public API, documentation, SDK, or
  discovery surface (.well-known, llms.txt) to enrich. This profile remains a historical company
  stub, originally surfaced as a portfolio company of bloomberg-beta.
